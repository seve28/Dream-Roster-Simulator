<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Визиты</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #e8eef7; color: #0f172a; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
    h1 { color: #1e3a8a; margin: 8px 0 12px; }
    .muted { color: #475569; }
    a { color: #1d4ed8; }
    #status { margin: 16px 0; min-height: 28px; }
  </style>
</head>
<body>
  <main>
    <p class="muted">только эта страница</p>
    <h1>Визиты</h1>
    <p class="muted">Число открытий главной. Имена не пишутся.</p>
    <p id="status">Загружаю счётчик…</p>
    <p><img id="badge" alt="visits" height="24" /></p>
    <p><a href="./">на сайт</a></p>
  </main>
  <script>
    const urls = [
      "https://hits.sh/seve28.github.io/Dream-Roster-Simulator.svg?label=visits&color=1d4ed8&labelColor=1e3a8a&t=" + Date.now(),
      "https://hitscounter.dev/api/hit?url=https://seve28.github.io/Dream-Roster-Simulator&label=visits&icon=eye&color=%231d4ed8"
    ];
    const img = document.getElementById("badge");
    const status = document.getElementById("status");
    let i = 0;
    const timer = setTimeout(function () {
      status.textContent = "Счётчик отвечает медленно. Страница уже открыта — подожди картинку или обнови.";
    }, 2500);
    function tryNext() {
      if (i >= urls.length) {
        status.textContent = "Сервисы счётчика не ответили. Открой позже.";
        return;
      }
      img.onload = function () {
        clearTimeout(timer);
        status.textContent = "Текущее число:";
      };
      img.onerror = function () { i += 1; tryNext(); };
      img.src = urls[i];
    }
    tryNext();
  </script>
</body>
</html>
